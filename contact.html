     <h1>Customer Registration And Order Form</h1>     
     <form>
        <h3>Customer Infromation</h3>
        <label for="fullname">Fullname</label>
        <br>
        <input type="text" id="fullname" name="fullname">
        <br><br>

        <label for="email">Email</label>
        <br>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password">Password</label>
        <br>
        <input type="password" id="password" name="password">
        <br><br>

        <label for="phoneno">Phone Number</label>
        <br>
        <input type="phoneno" id="phoneno" name="phoneno">
        <br><br>

        <h3>Order Infrormation</h3>
        <label for="quantity">Quantity</label>
        <br>
        <input type="number" id="quantity" name="quantity">
        <br>
        <br>
        <label for="deliverydate">Preferd Delivery Date</label>
        <br>
        <input type="date" id="deliverydate" name="deliverydate">
        <br><br>

         <label for="food">Selected Food item</label>
         <br>
         <select id="food" name="food">
            <option> Veg Pizza</option>
            <option> Red sauce pasta</option>
            <option> sandwich</option>
            <option>Burger</option>
            <option> Farmhouse Pizza</option>
            <option> Veg Burger</option>
            <option> Dessert</option>
         </select>
         <br>

         <h3>Payment Option</h3>
         <input type="radio" id="cash" name="payment">
         <lable for="cash">cash</lable>
         <br>

         <input type="radio" id="card" name="payment">
         <lable for="card">Card</lable>
         <br>

         <input type="radio" id="UPI" name="payment">
         <lable for="UPI">UPI</lable>
         <br>

         <h3>Extras</h3>
         <input type="checkbox" id="cheese" name="extras">
        <label for="cheese"> Extra Cheese </label>
        <br>

        <input type="checkbox" id="coffee" name="extras">
        <label for="coffee"> cold coffee </label>
        <br>

        <input type="checkbox" id="Dessert" name="extras">
        <label for="Dessert"> Dessert </label>
        <br>

        <h3>Delivery Instructions</h3>
        <lable for="address">Address</lable>
        <br>
        <textarea id="address" name="address" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="place-order">
        <input type="reset" value="clear-form">
     </form>
